[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-alert-calibration"
version = "0.1.0"
description = "Reproducible conformal calibration and event-level evaluation for industrial anomaly alerts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "pyarrow>=14"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
industrial-alerts = "industrial_alert_calibration.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
